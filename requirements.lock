# Pinned dependency set for reproducible installs (Docker + CI).
#
# Resolved for the release target — CPython 3.11 on Linux x86_64 — with pip's
# resolver in dry-run mode, NOT frozen from a dev machine: a freeze from the
# local 3.13 environment pinned numpy/contourpy releases that require >=3.12
# and would not install on 3.11. Regenerate with the same constraints:
#
#   pip install --dry-run --ignore-installed --report report.json \
#     --python-version 3.11 --implementation cp --abi cp311 \
#     --platform manylinux2014_x86_64 --only-binary=:all: --target /tmp/x \
#     fastapi uvicorn sqlalchemy pydantic-settings httpx matplotlib groq pytest
#
# Top-level constraints live in pyproject.toml. Versions are pinned but not
# hash-locked (hashes are platform-specific; see README 'What I would not ship').

