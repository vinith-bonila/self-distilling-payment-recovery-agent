[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "payment-recovery-agent"
version = "0.1.0"
description = "Self-distilling payment recovery agent: an LLM that writes the rules that replace it."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlalchemy>=2.0",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "matplotlib>=3.8",
  "groq>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["agentcore", "agentcore.guardrails", "agentcore.rules", "agentcore.agent", "agentcore.eval", "agentcore.distill", "providers", "recovery", "llm", "evals"]
py-modules = ["config"]

[tool.pytest.ini_options]
# Target runtime is 3.11; we develop against the locally available 3.13.
pythonpath = [".", "tests"]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
